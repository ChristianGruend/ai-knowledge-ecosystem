name: 🔄 Knowledge Sync

on:
  # Täglich um 03:00 UTC
  schedule:
    - cron: "0 3 * * *"

  # Manuell ausführbar via GitHub UI
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Repository auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: 🚀 Pipeline ausführen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/pipeline.py
        # knowledge-base/ und prompts/ bleiben lokal (.gitignore)

      - name: 📤 Code-Änderungen committen (keine persönlichen Daten)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Nur Scripts und Config pushen – niemals knowledge-base/ oder prompts/
          git add scripts/ config.json requirements.txt README.md
          git diff --staged --quiet || git commit -m "🔄 Pipeline update $(date +'%Y-%m-%d %H:%M UTC')"
          git push
